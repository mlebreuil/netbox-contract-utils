services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
      args:
        PG_VERSION: ${POSTGRES_VERSION:-17}

    volumes:
      # Only the netbox root folder (the parent of .devcontainer) is mounted.
      - ..:/workspaces/netbox:cached

    env_file: ".env"

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container (so "localhost" is the DB)
    # and allows "forwardPorts" in devcontainer.json to work. Redis is reachable as "redis".
    network_mode: service:db

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    # Pin the major version: "latest" can jump versions and refuse to start on an
    # existing data volume. NetBox 4.7 requires PostgreSQL 15 or later (docs/installation/1-postgresql.md).
    image: postgres:${POSTGRES_VERSION:-17}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

    env_file: ".env"

    # Dev/test only: trade durability for speed (much faster test runs and demo data loads).
    # Never use these flags for data you cannot recreate from a dump.
    command: >
      postgres
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
